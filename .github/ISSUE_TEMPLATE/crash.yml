name: Crash
description: The shell crashed or froze
labels: ["crash"]
title: "[CRASH] "
body:
  - type: markdown
    attributes:
      value: |
        If the crash report window offered to open this form, the crash log is already saved on your machine
        under `~/.cache/quickshell/crashes/`. Please attach the `report.txt` and `log.qslog.log` from the newest folder.
  - type: textarea
    attributes:
      label: Your system
      description: Paste the output of `quickshell --version`, `Hyprland --version`, and your distribution name.
      render: text
    validations:
      required: true
  - type: textarea
    attributes:
      label: What were you doing
      description: What you did just before the crash, and whether it happens every time.
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Reminder
      options:
        - label: I understand that it is usually impossible for others to help without the crash log.
          required: true

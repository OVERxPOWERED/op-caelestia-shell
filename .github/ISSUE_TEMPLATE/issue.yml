name: Issue
description: Report something that does not work in OP-Caelestia Shell
labels: ["bug"]
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A good report is one someone else can reproduce.
        If the problem also happens in vanilla Caelestia, report it to [caelestia-dots/shell](https://github.com/caelestia-dots/shell) instead.
  - type: checkboxes
    attributes:
      label: Before you submit
      options:
        - label: I am using OP-Caelestia Shell (not vanilla Caelestia).
          required: true
        - label: I have updated the shell and my system packages.
          required: false
  - type: textarea
    attributes:
      label: Your system
      description: Paste the output of `quickshell --version`, `Hyprland --version`, and your distribution name (Arch, CachyOS, ...). Nexus > Doctor also shows useful health information.
      render: text
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs
      description: Paste the output of `quickshell log` around the time of the problem.
      render: text
